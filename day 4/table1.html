<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average</title>
<link rel="icon" href="./files/image.png">
</head>
<body>

   
<h2>A test table with merged cells</h2>

    <table border="1" style="border-collapse: collapse; width: 100%;">
        <tr>
            <!-- Empty cell for Male/Female column -->
            <th rowspan="2"></th>

            <!-- Average spans two columns -->
            <th colspan="2">Average</th>

            <!-- Red eyes spans two rows -->
            <th rowspan="2">Red<br>eyes</th>
        </tr>

        <tr>
            <th>height</th>
            <th>weight</th>
        </tr>

        <tr>
            <th>Males</th>
            <td>1.9</td>
            <td>0.003</td>
            <td>40%</td>
        </tr>

        <tr>
            <th>Females</th>
            <td>1.7</td>
            <td>0.002</td>
            <td>43%</td>
        </tr>
    </table>

</body>
</html>
